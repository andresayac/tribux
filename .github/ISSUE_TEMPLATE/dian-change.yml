name: Cambio DIAN
about: Registrar un cambio normativo/técnico oficial
title: "dian: "
labels: [dian-change]
body:
  - type: input
    id: source
    attributes:
      label: Fuente oficial
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión/resolución/anexo
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impacto esperado
