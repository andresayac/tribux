openapi: 3.1.1
info:
  title: Tribux API
  version: 0.1.0
  description: >-
    Contrato inicial y NO estable de la API comunitaria Tribux.
    Este archivo define intención de diseño; todavía no implica compliance DIAN.
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8080
    description: Local development
security: []
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Check API process health
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                    const: tribux-api
  /v1/invoices:
    post:
      operationId: createInvoice
      tags: [Invoices]
      summary: Create an invoice for asynchronous processing
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
      responses:
        '202':
          description: Invoice accepted for processing
          headers:
            Location:
              description: Relative URL of the created invoice resource.
              schema:
                type: string
            Idempotency-Replayed:
              description: Whether this response replays a resource created by an earlier request.
              schema:
                type: string
                enum: ['true', 'false']
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResource'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/invoices/{invoice_id}:
    get:
      operationId: getInvoice
      tags: [Invoices]
      summary: Get an invoice resource
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Invoice resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResource'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/invoices/{invoice_id}/status:
    get:
      operationId: getInvoiceStatus
      tags: [Invoices]
      summary: Get the current invoice processing status
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Current internal processing status for an invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceStatusResource'
        '404':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key unique within issuer and operation.
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: '^[A-Za-z0-9._:-]+$'
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller correlation ID. Invalid values are replaced by the server.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[A-Za-z0-9._:-]+$'
  headers:
    RequestId:
      description: Correlation ID accepted or generated by the server.
      schema:
        type: string
  responses:
    Problem:
      description: RFC Problem Details response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    NonNegativeDecimalAmount:
      type: string
      pattern: '^[0-9]+(?:\.[0-9]{1,6})?$'
      examples: ['100000.00']
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          $ref: '#/components/schemas/NonNegativeDecimalAmount'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          examples: [COP]
    Party:
      type: object
      required: [identification, name]
      properties:
        identification:
          type: string
        identification_type:
          type: string
          description: Stable Tribux code; mapping to DIAN catalog is adapter responsibility.
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
    TaxInput:
      type: object
      required: [type, rate]
      properties:
        type:
          type: string
          examples: [VAT]
        rate:
          type: string
          pattern: '^[0-9]+(?:\\.[0-9]{1,4})?$'
          examples: ['19.00']
    InvoiceLineInput:
      type: object
      required: [description, quantity, unit_price]
      properties:
        description:
          type: string
          minLength: 1
        quantity:
          type: string
          pattern: '^[0-9]+(?:\.[0-9]{1,6})?$'
        unit_price:
          $ref: '#/components/schemas/Money'
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/TaxInput'
    CreateInvoiceRequest:
      type: object
      required: [issuer_id, customer, lines]
      properties:
        issuer_id:
          type: string
          description: Internal issuer/tenant identifier.
        number:
          type: string
          description: Optional in early design; final numbering workflow is pending ADR/compliance.
        customer:
          $ref: '#/components/schemas/Party'
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InvoiceLineInput'
    InvoiceResource:
      type: object
      required: [id, issuer_id, status, number, cufe, created_at]
      properties:
        id:
          type: string
          format: uuid
        issuer_id:
          type: string
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        cufe:
          type: [string, 'null']
        number:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    InvoiceStatus:
      type: string
      description: >-
        Internal Tribux processing status. It never mirrors a DIAN status:
        `awaiting_reconciliation` means the submission outcome is unknown and
        must be resolved by querying DIAN, never by resending.
      enum:
        - queued
        - building
        - signed
        - submitted
        - accepted
        - rejected
        - awaiting_reconciliation
        - retryable_failure
        - permanent_failure
    InvoiceStatusResource:
      type: object
      required: [id, status, cufe]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        cufe:
          type: [string, 'null']
    Problem:
      type: object
      required: [type, title, status, code, trace_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        trace_id:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [source, code, message]
            properties:
              source:
                type: string
              code:
                type: string
              message:
                type: string
              path:
                type: string
